<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DroneWeather Pro - Previsão para Drone</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121214">
    <link rel="apple-touch-icon" href="icone.png">
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            padding: 8px 10px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Linha Topo: Busca compacta + Botão GPS integrado */
        .topo-barra {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .topo-barra input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #202024;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .topo-barra input:focus {
            border-color: #00b37e;
        }

        .btn-busca {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background-color: #01a299;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gps-topo {
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            background-color: #2e7d32;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Seletor de Altitude Compacto */
        .altitude-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #202024;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .altitude-label {
            font-size: 12px;
            font-weight: bold;
            color: #a8a8b3;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .altitude-selector {
            display: flex;
            gap: 3px;
            background-color: #121214;
            padding: 2px;
            border-radius: 5px;
        }

        .alt-btn {
            border: none;
            background: transparent;
            color: #8d8d99;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .alt-btn.ativa {
            background-color: #00b37e;
            color: #fff;
        }

        /* Abas de Dias */
        .abas-container {
            display: flex;
            justify-content: space-between;
            background-color: #202024;
            padding: 3px;
            border-radius: 6px;
            gap: 3px;
        }

        .aba-btn {
            flex: 1;
            padding: 6px 0;
            border: none;
            background: transparent;
            color: #8d8d99;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            touch-action: manipulation;
        }

        .aba-btn.ativa {
            background-color: #121214;
            color: #fff;
            border-bottom: 2px solid #00b37e;
        }

        /* Mini Timeline Horária */
        .horas-scroll {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 3px;
            scrollbar-width: none;
        }

        .horas-scroll::-webkit-scrollbar {
            display: none;
        }

        .hora-card {
            flex: 0 0 auto;
            background-color: #202024;
            padding: 4px 6px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #29292e;
            min-width: 62px;
            touch-action: manipulation;
        }

        .hora-card.ativa {
            border-color: #00b37e;
            background-color: #2a2a30;
        }

        .hora-card .hora-titulo {
            font-size: 10px;
            font-weight: bold;
            color: #a8a8b3;
        }

        .hora-card .hora-clima-icon {
            font-size: 13px;
            line-height: 1.1;
        }

        .hora-card .hora-vento {
            font-size: 10px;
            font-weight: bold;
        }

        /* Status de Voo Principal */
        .status-box {
            padding: 7px 10px;
            border-radius: 6px;
            text-align: center;
            background-color: #28a745;
            color: #fff;
            transition: background-color 0.3s;
        }

        .status-box h2 {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .status-box p {
            font-size: 11px;
            opacity: 0.95;
        }

        /* Títulos de seção ultra compactos */
        .secao-titulo {
            font-size: 10px;
            color: #00b37e;
            font-weight: bold;
            margin-top: 1px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .card-dados {
            background-color: #202024;
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .item-dado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .item-dado span:first-child {
            color: #c4c4cc;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .valor-dados {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #29292e;
            font-size: 12px;
        }

        .valor-dados.bom { color: #00b37e; }
        .valor-dados.atencao { color: #ffc107; }
        .valor-dados.perigo { color: #f75a68; }

        /* Mapa na parte inferior */
        #mapa {
            height: 140px;
            width: 100%;
            border-radius: 6px;
            z-index: 1;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Topo Unificado: Busca de cidade + Botão GPS juntos -->
        <div class="topo-barra">
            <input type="text" id="campoCidade" placeholder="Cidade ou bairro..." onkeydown="if(event.key==='Enter') buscarPorCidade()">
            <button type="button" class="btn-busca" onclick="buscarPorCidade()">Buscar</button>
            <button type="button" class="btn-gps-topo" onclick="buscarPorGPS()" title="Usar GPS Atual">📍 GPS</button>
        </div>

        <!-- Seletor de Altitude Compacto -->
        <div class="altitude-row">
            <div class="altitude-label">
                <span>🚁</span> Altitude:
            </div>
            <div class="altitude-selector">
                <button type="button" id="btnAlt10" class="alt-btn" onclick="mudarAltitude(10)">10m (Solo)</button>
                <button type="button" id="btnAlt80" class="alt-btn ativa" onclick="mudarAltitude(80)">80m</button>
                <button type="button" id="btnAlt120" class="alt-btn" onclick="mudarAltitude(120)">120m (Teto)</button>
            </div>
        </div>

        <!-- Abas de Dias (5 dias) -->
        <div class="abas-container">
            <button type="button" id="aba0" class="aba-btn ativa" onclick="mudarAba(0)">Hoje</button>
            <button type="button" id="aba1" class="aba-btn" onclick="mudarAba(1)">Amanhã</button>
            <button type="button" id="aba2" class="aba-btn" onclick="mudarAba(2)">--</button>
            <button type="button" id="aba3" class="aba-btn" onclick="mudarAba(3)">--</button>
            <button type="button" id="aba4" class="aba-btn" onclick="mudarAba(4)">--</button>
        </div>

        <!-- Mini Carrossel de Horários -->
        <div id="horasScroll" class="horas-scroll">
            <!-- Inserido dinamicamente via JS -->
        </div>

        <!-- Alerta e Status de Voo Principal -->
        <div id="statusVoo" class="status-box">
            <h2 id="textoStatus">Aguardando dados...</h2>
            <p id="nomeLocal">Local: --</p>
        </div>

        <!-- Seção de Ventos na Altitude Escolhida -->
        <div class="secao-titulo">VENTO (<span id="labelAltitudeVento">80m</span>)</div>
        <div class="card-dados">
            <div class="item-dado">
                <span>💨 Velocidade do Vento</span>
                <span id="valorVento" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌪️ Rajada Máxima</span>
                <span id="valorRajada" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🧭 Direção</span>
                <span id="valorDirecao" class="valor-dados">--</span>
            </div>
        </div>

        <!-- Seção de Condições de Voo & Drone -->
        <div class="secao-titulo">CONDIÇÕES & SEGURANÇA</div>
        <div class="card-dados">
            <div class="item-dado">
                <span>🌤️ Tempo</span>
                <span id="valorCondicao" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌧️ Chuva</span>
                <span id="valorChuvaMm" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>☔ Probabilidade</span>
                <span id="valorChuva" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🛰️ Índice KP Solar</span>
                <span id="valorKp" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>👁️ Visibilidade</span>
                <span id="valorVisibilidade" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌡️ Temperatura</span>
                <span id="valorTemp" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>💧 Umidade</span>
                <span id="valorUmidade" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>☁️ Nuvens</span>
                <span id="valorNuvens" class="valor-dados">--</span>
            </div>
        </div>

        <!-- Mapa Leaflet na parte inferior da rolagem -->
        <div id="mapa"></div>
    </div>

    <!-- Script do Leaflet (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script principal -->
    <script src="app.js"></script>

</body>
</html>
