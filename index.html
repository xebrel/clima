<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão para Voo</title>
    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Busca */
        .busca-container {
            display: flex;
            gap: 8px;
        }

        .busca-container input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #29292e;
            background-color: #202024;
            color: #fff;
            font-size: 14px;
        }

        .busca-container button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #01a299;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gps {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2e7d32;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* Abas */
        .abas-container {
            display: flex;
            justify-content: space-between;
            background-color: #202024;
            padding: 4px;
            border-radius: 6px;
            gap: 4px;
        }

        .aba-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: #8d8d99;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .aba-btn.ativa {
            background-color: #121214;
            color: #fff;
            border-bottom: 2px solid #00b37e;
        }

        /* Status de Voo */
        .status-box {
            padding: 14px;
            border-radius: 6px;
            text-align: center;
            background-color: #28a745;
            color: #fff;
            transition: background-color 0.3s;
        }

        .status-box h2 {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .status-box p {
            font-size: 12px;
            opacity: 0.9;
        }

        /* Seções de Dados */
        .secao-titulo {
            font-size: 12px;
            color: #00b37e;
            font-weight: bold;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .card-dados {
            background-color: #202024;
            border-radius: 6px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-dado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .item-dado span:first-child {
            color: #c4c4cc;
        }

        .valor-dados {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #29292e;
        }

        .valor-dados.bom { color: #00b37e; }
        .valor-dados.atencao { color: #ffc107; }
        .valor-dados.perigo { color: #f75a68; }

        /* Mapa */
        #mapa {
            height: 180px;
            width: 100%;
            border-radius: 6px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Campo de busca por Cidade -->
        <div class="busca-container">
            <input type="text" id="campoCidade" placeholder="Digite a cidade...">
            <button onclick="buscarPorCidade()">Buscar</button>
        </div>

        <!-- Botão de localização GPS -->
        <button class="btn-gps" onclick="buscarPorGPS()">Usar Localização Atual (GPS)</button>

        <!-- Abas de Dias -->
        <div class="abas-container">
            <button id="aba0" class="aba-btn ativa" onclick="mudarAba(0)">Hoje</button>
            <button id="aba1" class="aba-btn" onclick="mudarAba(1)">Amanhã</button>
            <button id="aba2" class="aba-btn" onclick="mudarAba(2)">--</button>
            <button id="aba3" class="aba-btn" onclick="mudarAba(3)">--</button>
            <button id="aba4" class="aba-btn" onclick="mudarAba(4)">--</button>
        </div>

        <!-- Alerta e Status de Voo -->
        <div id="statusVoo" class="status-box">
            <h2 id="textoStatus">Aguardando dados...</h2>
            <p id="nomeLocal">Local: --</p>
        </div>

        <!-- Seção de Ventos -->
        <div class="secao-titulo">VENTO</div>
        <div class="card-dados">
            <div class="item-dado">
                <span>💨 Velocidade do Vento</span>
                <span id="valorVento" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌪️ Rajada de Vento</span>
                <span id="valorRajada" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🧭 Direção</span>
                <span id="valorDirecao" class="valor-dados">--</span>
            </div>
        </div>

        <!-- Seção de Condições Geral -->
        <div class="secao-titulo">CONDIÇÕES</div>
        <div class="card-dados">
            <div class="item-dado">
                <span>🌤️ Condição do Tempo</span>
                <span id="valorCondicao" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌡️ Temperatura</span>
                <span id="valorTemp" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>💧 Umidade do Ar</span>
                <span id="valorUmidade" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>🌧️ Probabilidade de Chuva</span>
                <span id="valorChuva" class="valor-dados">--</span>
            </div>
            <div class="item-dado">
                <span>☁️ Cobertura de Nuvens</span>
                <span id="valorNuvens" class="valor-dados">--</span>
            </div>
        </div>

        <!-- Mapa Leaflet -->
        <div id="mapa"></div>
    </div>

    <!-- Script do Leaflet (Mapa) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script principal -->
    <script src="app.js"></script>

</body>
</html>
